<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#stoop</title>
<style>
  :root{
    --bg: #fbf3e7;
    --card: #ffffff;
    --ink: #2b2320;
    --muted: #6b5f56;
    --amber: #d98c2b;
    --amber-dark: #b8701c;
    --line: #ecdfc9;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  header{
    padding: 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .wrap{ max-width: 560px; margin: 0 auto; width: 100%; }
  .back{
    display:inline-block;
    color: var(--muted);
    text-decoration:none;
    font-size: 0.9rem;
    margin-bottom: 6px;
  }
  h1{ margin: 0; font-size: 1.4rem; }
  .whoami{
    margin-top: 8px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .whoami a{ color: var(--amber-dark); font-weight: 600; text-decoration: none; }
  .whoami strong{ color: var(--ink); }
  .search-bar{
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .search-bar input{
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-size: 0.95rem;
    background: var(--card);
    color: var(--ink);
  }
  .search-bar input:focus{ outline: 2px solid var(--amber); }
  main{
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .empty{
    color: var(--muted);
    text-align: center;
    margin-top: 40px;
  }
  .msg{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 10px;
    max-width: 560px;
    box-shadow: 0 1px 6px rgba(60, 40, 10, 0.05);
  }
  .msg .sender{
    font-weight: 600;
    color: var(--amber-dark);
    margin-right: 6px;
  }
  .msg .time{
    display:block;
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 4px;
  }
  form{
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  input[type=text]{
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-size: 1rem;
    background: var(--card);
    color: var(--ink);
  }
  input[type=text]:focus{ outline: 2px solid var(--amber); }
  button{
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: var(--amber);
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled{ background: #e2c193; cursor: default; }
  button:active:not(:disabled){ background: var(--amber-dark); }
  .status{
    text-align:center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 4px 16px 0;
  }
  .char-count{
    align-self: flex-end;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .char-count.low{ color: var(--amber-dark); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="back" href="chat.html">&larr; Channels</a>
    <h1>#stoop</h1>
    <div class="whoami" id="whoami"></div>
  </div>
</header>

<div class="search-bar">
  <div class="wrap">
    <input type="text" id="search" placeholder="Search messages&hellip;" autocomplete="off">
  </div>
</div>

<main id="messages">
  <div class="empty" id="empty">No messages yet. Be the first to say hello.</div>
</main>

<div class="status" id="status"></div>

<form id="send-form">
  <div class="wrap" style="display:flex; flex-direction:column; gap:4px; width:100%;">
    <div style="display:flex; gap:10px;">
      <input type="text" id="text" maxlength="150" placeholder="Message #stoop&hellip;" autocomplete="off">
      <button type="submit" id="send-btn">Send</button>
    </div>
    <span class="char-count" id="char-count"></span>
  </div>
</form>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyEl = document.getElementById('empty');
  const statusEl = document.getElementById('status');
  const form = document.getElementById('send-form');
  const input = document.getElementById('text');
  const sendBtn = document.getElementById('send-btn');
  const whoamiEl = document.getElementById('whoami');
  const searchInput = document.getElementById('search');
  const charCountEl = document.getElementById('char-count');

  const username = (localStorage.getItem('stoop_username') || '').trim();
  let allMessages = [];
  let maxPostBytes = 128; // corrected by /api/stoop/max_message_bytes below; server enforces the real value regardless
  let budgetOk = false;    // unknown until the first /api/limits response -- fail closed, not open
  let waitMs = 0;

  if (username) {
    whoamiEl.innerHTML = `You are <strong>${escapeHtml(username)}</strong>`;
  } else {
    whoamiEl.innerHTML = `<a href="chat.html">Pick a username to chat &rarr;</a>`;
    input.disabled = true;
    input.placeholder = 'Pick a username on the Channels page first';
  }

  // the send button must reflect known limits *before* the user types anything --
  // never let someone compose a message only to have it rejected
  function updateSendability() {
    sendBtn.disabled = !username || !budgetOk;
    if (!username) return; // whoami banner already explains this case
    if (!budgetOk) {
      const secs = Math.ceil(waitMs / 1000);
      statusEl.textContent = `Sending is paused -- try again in ${secs}s.`;
    } else if (statusEl.textContent.startsWith('Sending is paused')) {
      statusEl.textContent = '';
    }
  }
  updateSendability(); // disable immediately; refreshLimits() below will enable once budget is confirmed

  // live "characters left" counter -- counts UTF-8 bytes under the hood (what
  // the server actually enforces) but is always shown to the user as characters
  function updateCharCount() {
    const used = new TextEncoder().encode(input.value).length;
    const remaining = maxPostBytes - used;
    charCountEl.textContent = `${remaining} character${remaining === 1 ? '' : 's'} left`;
    charCountEl.classList.toggle('low', remaining <= 20);
  }
  input.addEventListener('input', updateCharCount);
  updateCharCount();

  async function loadMaxLength() {
    try {
      const res = await fetch('/api/stoop/max_message_bytes');
      if (res.ok) {
        const n = parseInt(await res.text(), 10);
        if (n > 0) maxPostBytes = n;
      }
    } catch (e) {
      // keep the guessed default; the server still enforces the real limit either way
    }
    updateCharCount();
  }

  function getSessionToken() {
    return localStorage.getItem('stoop_session') || '';
  }

  // wraps fetch to attach the session-token header and adopt whatever token
  // the node hands back -- the node may issue a new one (first contact) or
  // re-confirm an existing one on every response
  async function apiFetch(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'X-Stoop-Session': getSessionToken() });
    const res = await fetch(path, opts);
    const token = res.headers.get('X-Stoop-Session');
    if (token) localStorage.setItem('stoop_session', token);
    return res;
  }

  function applyLimits(data) {
    maxPostBytes = data.max_post_bytes || maxPostBytes;
    budgetOk = data.tokens_remaining > 0 && data.node_tokens_remaining > 0;
    waitMs = data.next_token_ms || 0;
    updateSendability();
  }

  async function refreshLimits() {
    try {
      const res = await apiFetch('/api/limits');
      if (!res.ok) return;
      applyLimits(await res.json());
    } catch (e) {
      // leave last-known limits in place; the messages poll already surfaces connectivity issues
    }
  }

  function splitSender(text) {
    const i = text.indexOf(': ');
    if (i === -1) return { sender: null, body: text };
    return { sender: text.slice(0, i), body: text.slice(i + 2) };
  }

  function formatTime(ts) {
    // ts is only meaningful once the node's clock has been set
    if (!ts || ts < 1600000000) return '';
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function render(list, query) {
    messagesEl.innerHTML = '';
    if (list.length === 0) {
      emptyEl.textContent = query ? 'No messages match your search.' : 'No messages yet. Be the first to say hello.';
      messagesEl.appendChild(emptyEl);
      return;
    }
    for (const m of list) {
      const { sender, body } = splitSender(m.text);
      const div = document.createElement('div');
      div.className = 'msg';
      const senderSpan = sender ? `<span class="sender">${escapeHtml(sender)}</span>` : '';
      const time = formatTime(m.ts);
      div.innerHTML = `${senderSpan}${escapeHtml(body)}` +
        (time ? `<span class="time">${time}</span>` : '');
      messagesEl.appendChild(div);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // client-side exact (case-insensitive) text search over the currently loaded messages
  function applyFilter() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = q ? allMessages.filter(m => m.text.toLowerCase().includes(q)) : allMessages;
    render(filtered, q);
  }

  searchInput.addEventListener('input', applyFilter);

  async function refresh() {
    try {
      const res = await fetch('/api/stoop/messages');
      if (!res.ok) throw new Error('bad response');
      allMessages = await res.json();
      applyFilter();
      if (statusEl.textContent.startsWith("Can't reach")) statusEl.textContent = '';
    } catch (e) {
      statusEl.textContent = "Can't reach the radio right now.";
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !username || sendBtn.disabled) return;

    if (new TextEncoder().encode(text).length > maxPostBytes) {
      statusEl.textContent = `Message is too long (max ${maxPostBytes} characters).`;
      return;
    }

    sendBtn.disabled = true;
    try {
      const res = await apiFetch('/api/post', {
        method: 'POST',
        body: new URLSearchParams({ username, text })
      });
      const data = await res.json().catch(() => null);

      if (res.status === 429 && data) {
        applyLimits(data); // disables the button and shows the wait time
        return;
      }
      if (!res.ok) throw new Error('send failed');

      if (data) applyLimits(data);
      input.value = '';
      updateCharCount();
      await refresh();
    } catch (e) {
      statusEl.textContent = 'Message failed to send. Try again.';
    } finally {
      updateSendability();
      input.focus();
    }
  });

  refresh();
  refreshLimits();
  loadMaxLength();
  setInterval(() => { refresh(); refreshLimits(); }, 3000);
</script>
</body>
</html>
