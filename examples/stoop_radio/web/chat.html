<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoop Chat</title>
<style>
  :root{
    --bg: #fbf3e7;
    --card: #ffffff;
    --ink: #2b2320;
    --muted: #6b5f56;
    --amber: #d98c2b;
    --amber-dark: #b8701c;
    --line: #ecdfc9;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    padding: 24px 16px 60px;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }
  .back{
    display:inline-block;
    color: var(--muted);
    text-decoration:none;
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  h1{
    font-size: 1.7rem;
    margin: 0 0 4px;
  }
  .tagline{
    color: var(--muted);
    margin: 0 0 24px;
  }
  .channel-list{
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .channel{
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 12px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 2px 10px rgba(60, 40, 10, 0.05);
    transition: transform 0.05s ease, box-shadow 0.15s ease;
  }
  .channel:active{ transform: translateY(1px); }
  .channel:hover{ box-shadow: 0 4px 14px rgba(60, 40, 10, 0.10); }
  .hash{
    display:flex;
    align-items:center;
    justify-content:center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 10px;
    background: #fff2d9;
    color: var(--amber-dark);
    font-weight: 700;
    font-size: 1.2rem;
  }
  .channel-info{ flex: 1; }
  .channel-name{ font-weight: 600; font-size: 1.05rem; }
  .channel-desc{ color: var(--muted); font-size: 0.9rem; }
  .arrow{ color: var(--amber); font-size: 1.3rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Back</a>
  <h1>Channels</h1>
  <p class="tagline">Pick a channel to read and send messages.</p>

  <ul class="channel-list">
    <li>
      <a class="channel" href="stoop.html">
        <span class="hash">#</span>
        <span class="channel-info">
          <span class="channel-name">stoop</span><br>
          <span class="channel-desc">The main neighborhood channel</span>
        </span>
        <span class="arrow">&rarr;</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
